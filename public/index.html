<!doctype html>
<html lang="es-CR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Marvin · Gastos en colones</title>
    <meta
      name="description"
      content="Marvin es un registro de gastos en colones costarricenses. Funciona sin conexión y se puede instalar como aplicación."
    />
    <meta name="theme-color" content="#073c35" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Marvin" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <script>
      // Apply the theme before paint to avoid a flash of the wrong palette.
      (() => {
        try {
          const saved = localStorage.getItem('marvin.theme.v1');
          const system = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
          document.documentElement.dataset.theme =
            saved === 'light' || saved === 'dark' ? saved : system;
        } catch {
          /* storage can be blocked */
        }
      })();
    </script>

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./assets/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#contenido">Saltar al contenido</a>

    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="./" aria-label="Marvin, inicio">
          <span class="brand-mark" aria-hidden="true">₡</span>
          <span class="brand-text">
            <h1>Marvin</h1>
            <small>Gastos al día</small>
          </span>
        </a>

        <div class="topbar-actions">
          <button type="button" class="btn-install" id="install-btn" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3v12m0 0 4-4m-4 4-4-4M5 17v2a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-2" />
            </svg>
            <span>Instalar</span>
          </button>

          <button
            type="button"
            class="icon-btn"
            id="theme-btn"
            aria-label="Cambiar tema"
            title="Cambiar tema"
          >
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 15.2A8.5 8.5 0 0 1 8.8 4a8.5 8.5 0 1 0 11.2 11.2Z" />
            </svg>
          </button>

          <button
            type="button"
            class="icon-btn"
            id="refresh-btn"
            aria-label="Actualizar datos"
            title="Actualizar datos"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 11a8 8 0 1 0-2.3 6.7M20 4v7h-7" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main class="page" id="contenido">
      <section class="hero" aria-labelledby="total-label">
        <div class="hero-content">
          <p class="eyebrow" id="total-label">Total neto</p>
          <p class="hero-amount" id="total-amount">₡0</p>

          <dl class="hero-stats">
            <div>
              <dt>Gastos</dt>
              <dd id="summary-spent">₡0</dd>
            </div>
            <div>
              <dt>Créditos</dt>
              <dd id="summary-credits" class="is-credit">+₡0</dd>
            </div>
            <div>
              <dt>Movimientos</dt>
              <dd id="summary-count">0</dd>
            </div>
          </dl>

          <p class="status" id="status" aria-live="polite">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="status-text">Cargando datos…</span>
          </p>
        </div>
        <div class="hero-decoration" aria-hidden="true"></div>
      </section>

      <div class="dashboard">
        <section class="card tx-card" aria-labelledby="tx-heading">
          <div class="card-head">
            <div>
              <h2 id="tx-heading">Movimientos</h2>
              <p id="tx-subtitle">Todos los movimientos</p>
            </div>
            <span class="count-pill" id="results-count">0</span>
          </div>

          <div class="filters">
            <label class="field search-field">
              <span class="sr-only">Buscar movimientos</span>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="11" cy="11" r="7" />
                <path d="m16.5 16.5 4 4" />
              </svg>
              <input
                id="filter-search"
                type="search"
                placeholder="Buscar comercio…"
                autocomplete="off"
                enterkeyhint="search"
              />
            </label>

            <label class="field select-field">
              <span class="sr-only">Filtrar por comercio</span>
              <select id="filter-merchant">
                <option value="">Todos los comercios</option>
              </select>
            </label>

            <button type="button" class="clear-filters" id="clear-filters" hidden>
              Limpiar
            </button>
          </div>

          <div class="transactions" id="transactions" aria-live="polite">
            <div class="skeleton skeleton-row"></div>
            <div class="skeleton skeleton-row"></div>
            <div class="skeleton skeleton-row"></div>
          </div>

          <div class="empty" id="empty-state" hidden>
            <span class="empty-icon" id="empty-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Z" />
                <path d="M9 8h6M9 12h6" />
              </svg>
            </span>
            <p class="empty-title" id="empty-title">Sin movimientos</p>
            <p class="empty-text" id="empty-text"></p>
            <button type="button" class="btn-primary" id="empty-action" hidden></button>
          </div>

          <button type="button" class="btn-ghost" id="load-more" hidden>
            Mostrar más
          </button>
        </section>
      </div>
    </main>

    <footer class="footer">
      <p>Datos de solo lectura desde Google Sheets.</p>
      <p>Colones costarricenses · Redondeo hacia arriba</p>
    </footer>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <noscript>
      <p class="noscript">Marvin necesita JavaScript para mostrar sus gastos.</p>
    </noscript>

    <script type="module" src="./assets/app.js"></script>
  </body>
</html>
