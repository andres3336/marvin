<!doctype html>
<html lang="es-CR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Marvin · Gastos BCR</title>
    <meta
      name="description"
      content="Marvin es un registro de gastos BCR en colones costarricenses. Funciona sin conexión y se puede instalar como aplicación."
    />
    <meta name="theme-color" content="#063a75" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Marvin" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <script>
      // Apply the theme before paint to avoid a flash of the wrong palette.
      (() => {
        try {
          const saved = localStorage.getItem('marvin.theme.v1');
          const system = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
          const theme = saved === 'light' || saved === 'dark' ? saved : system;
          document.documentElement.dataset.theme = theme;
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute('content', theme === 'dark' ? '#050b14' : '#063a75');
        } catch {
          /* storage can be blocked */
        }
      })();
    </script>

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./assets/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#contenido">Saltar al contenido</a>

    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="./" aria-label="Marvin, inicio">
          <span class="brand-mark" aria-hidden="true">BCR</span>
          <span class="brand-text">
            <h1>Marvin</h1>
            <small>Gastos BCR</small>
          </span>
        </a>

        <div class="topbar-actions">
          <button type="button" class="btn-install" id="install-btn" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3v12m0 0 4-4m-4 4-4-4M5 17v2a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-2" />
            </svg>
            <span>Instalar</span>
          </button>

          <button
            type="button"
            class="icon-btn"
            id="settings-btn"
            aria-label="Ajustes"
            title="Ajustes"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="3" />
              <path
                d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"
              />
            </svg>
          </button>

          <button
            type="button"
            class="icon-btn"
            id="theme-btn"
            aria-label="Cambiar tema"
            title="Cambiar tema"
          >
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 15.2A8.5 8.5 0 0 1 8.8 4a8.5 8.5 0 1 0 11.2 11.2Z" />
            </svg>
          </button>

          <button
            type="button"
            class="icon-btn"
            id="refresh-btn"
            aria-label="Actualizar datos"
            title="Actualizar datos"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 11a8 8 0 1 0-2.3 6.7M20 4v7h-7" />
            </svg>
          </button>
        </div>
      </div>

      <div class="balance-bar">
        <div class="balance-inner">
          <span class="balance-label">Disponible</span>
          <span class="balance-amount" id="total-amount">0</span>
        </div>
      </div>
    </header>

    <main class="page" id="contenido">
      <section class="stats-card" aria-label="Resumen">
        <dl class="stats">
          <div>
            <dt>Gastos</dt>
            <dd id="summary-spent">0</dd>
          </div>
          <div>
            <dt>SINPE</dt>
            <dd id="summary-credits" class="is-credit">+0</dd>
          </div>
          <div>
            <dt>Movimientos</dt>
            <dd id="summary-count">0</dd>
          </div>
        </dl>

        <p class="status" id="status" aria-live="polite">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="status-text">Cargando datos…</span>
        </p>
      </section>

      <section class="card tx-card" aria-labelledby="tx-heading">
        <div class="card-head">
          <h2 id="tx-heading">Movimientos</h2>
          <span class="count-pill" id="results-count">0</span>
        </div>

        <div class="transactions" id="transactions" aria-live="polite">
          <div class="skeleton skeleton-row"></div>
          <div class="skeleton skeleton-row"></div>
          <div class="skeleton skeleton-row"></div>
        </div>

        <div class="empty" id="empty-state" hidden>
          <span class="empty-icon" id="empty-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Z" />
              <path d="M9 8h6M9 12h6" />
            </svg>
          </span>
          <p class="empty-title" id="empty-title">Sin movimientos</p>
          <p class="empty-text" id="empty-text"></p>
          <button type="button" class="btn-primary" id="empty-action" hidden></button>
        </div>

        <button type="button" class="btn-ghost" id="load-more" hidden>
          Mostrar más
        </button>
      </section>
    </main>

    <footer class="footer">
      <p>v<span data-version></span></p>
    </footer>

    <dialog class="settings-dialog" id="settings-dialog" aria-labelledby="settings-title">
      <form class="settings-form" id="settings-form" novalidate>
        <div class="settings-head">
          <div>
            <h2 id="settings-title">Ajustes</h2>
            <p>Configure la fuente de datos del CSV.</p>
          </div>
          <button
            type="button"
            class="icon-btn"
            id="settings-close"
            aria-label="Cerrar ajustes"
            title="Cerrar"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m6 6 12 12M18 6 6 18" />
            </svg>
          </button>
        </div>

        <label class="settings-field" for="settings-url">
          <span>URL del CSV publicado</span>
          <input
            id="settings-url"
            name="csv-url"
            type="url"
            inputmode="url"
            placeholder="https://…/output=csv"
            autocomplete="off"
            spellcheck="false"
            required
          />
        </label>

        <p class="settings-hint">
          Pegue la URL publicada de Google Sheets. Debe terminar en
          <code>output=csv</code>.
        </p>
        <p class="settings-error" id="settings-error" role="alert" hidden></p>

        <div class="settings-actions">
          <button type="button" class="btn-secondary" id="settings-default">
            URL original
          </button>
          <button type="submit" class="btn-primary">Guardar</button>
        </div>

        <p class="settings-version">Marvin v<span data-version></span></p>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <noscript>
      <p class="noscript">Marvin necesita JavaScript para mostrar sus gastos.</p>
    </noscript>

    <script type="module" src="./assets/app.js"></script>
  </body>
</html>
